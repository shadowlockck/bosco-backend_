services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - django_data:/app/data
    environment:
      DJANGO_DB_PATH: /app/data/db.sqlite3
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/", timeout=5)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  django_data:
